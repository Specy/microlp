name: Continuous Integration
on:
  pull_request:
  push:
    branches:
      - main
      - master
    tags:
      - v*

# Least privilege by default: no job here needs to write to the repository, and
# the publish job authenticates to crates.io with its own token. Without this
# block the workflow inherits the repository default, which can be a read/write
# GITHUB_TOKEN in every job.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  conformance:
    name: Conformance
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          key: ${{ runner.os }}-nightly-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'benchmark/Cargo.toml') }}
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy

      - name: Rustfmt
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked -- --deny warnings
  test:
    strategy:
      matrix:
        os:
          - windows-latest
          - macos-latest
          - ubuntu-latest

    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          key: ${{ runner.os }}-stable-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'benchmark/Cargo.toml') }}
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test Rust (unit tests)
        run: cargo test --locked --release --lib

      - name: Doctests
        run: cargo test --locked --release --doc

      - name: Exhaustive small-model oracles
        run: cargo test --locked --release --test exhaustive_mip

      # Problem-based correctness suite. Tiers are cumulative (easy < medium
      # < hard < xhard); --hard runs everything up to and including the hard
      # tier (long-running MILP benchmarks), with every single instance capped
      # at 5 minutes (--max-case-seconds 300, applied on top of each case's
      # own budget). The interrupt-tolerant hard cases pass cleanly at any
      # budget; nothing else needs anywhere near the cap. The xhard tier
      # (MILPBench instances beyond the solver's ceiling, 10-minute budgets)
      # stays manual: run it locally with
      # `cargo test --release --test suite -- --xhard`.
      # On Linux, additionally cross-check every result against HiGHS via
      # `--features highs`. The grounding is OS-independent, so it runs on one
      # runner only; building HiGHS needs CMake and a C++ compiler, both
      # preinstalled on ubuntu-latest.
      # The `--features highs` fragment below is a workflow literal selected by
      # the matrix, not external input, so interpolating it into the command is
      # safe and keeps the step shell-agnostic (this job also runs on Windows,
      # where the default shell is PowerShell).
      - name: Correctness suite
        run: cargo test --locked --release --test suite ${{ matrix.os == 'ubuntu-latest' && '--features highs' || '' }} -- --hard --parallel 4 --max-case-seconds 300

      - name: Test Rust with traces
        env:
          RUST_LOG: "trace"
        run: cargo test --locked --lib

  wasm:
    name: WASM
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          key: ${{ runner.os }}-wasm-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # Compile guard: the library must build for wasm on its own. It can because
      # it reads the clock from `web-time`, not `std::time::Instant` (which panics
      # on wasm32-unknown-unknown). Library only: dev-dependencies and the
      # benchmark crate stay native.
      - name: Build library for wasm32-unknown-unknown
        run: cargo build --locked --release --lib --target wasm32-unknown-unknown

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      # Runtime guard: build the example to wasm and actually solve an LP and a
      # MILP under Node. Each solve sets a time limit, so this exercises the
      # web-time clock at runtime — catching a `std::time::Instant` regression
      # that the compile step above cannot (it compiles fine, then panics).
      - name: Run the wasm example under Node
        working-directory: wasm-example
        run: |
          wasm-pack build --target nodejs
          node test.js

  publish-crate:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [conformance, test, wasm]

    name: Publish to Crates.io
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Nothing here talks to the repository, so do not leave the job's
          # GITHUB_TOKEN sitting in .git/config for the build to find.
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify tag matches crate version
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          # Select by name: this is a workspace, and `--no-deps` also lists the
          # benchmark crate, in no guaranteed order.
          manifest="$(cargo metadata --format-version 1 --no-deps \
            | jq -r '.packages[] | select(.name == "microlp") | .version')"
          if [[ "$tagged" != "$manifest" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $manifest" >&2
            exit 1
          fi
          echo "Publishing microlp $manifest"

      # The token goes through the environment, not the command line: argv is
      # readable by every other process on the runner via /proc, and unlike log
      # output it is not masked.
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: cargo publish --locked -p microlp
